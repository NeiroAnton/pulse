name: Build Pulse for Windows

"on":
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "assets/**"
      - "bin/**"
      - "package.json"
      - "build-windows.ps1"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download official sing-box
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/SagerNet/sing-box/releases/latest" `
            -Headers @{ "User-Agent" = "Pulse-GitHub-Actions" }

          $asset = $release.assets |
            Where-Object { $_.name -match 'windows-amd64.*\.zip$' } |
            Select-Object -First 1

          if (-not $asset) {
            throw "No Windows amd64 ZIP asset found."
          }

          New-Item -ItemType Directory -Force -Path "bin" | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive

          $destination = Join-Path $env:RUNNER_TEMP "singbox"
          Expand-Archive -Path $archive -DestinationPath $destination -Force

          $exe = Get-ChildItem -Path $destination -Filter "sing-box.exe" -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "sing-box.exe not found."
          }

          Copy-Item $exe.FullName "bin/sing-box.exe" -Force
          & "bin/sing-box.exe" version

      - name: Install dependencies
        run: npm install

      - name: Build NSIS installer
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Windows-Installer
          path: dist/Pulse-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
