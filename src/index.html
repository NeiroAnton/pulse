<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src https: http:; style-src 'self' 'unsafe-inline'; script-src 'self';"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><div class="logo">P</div><div><b>Pulse</b><small>PRIVATE BROWSER · 1.0</small></div></div><div class="vpn-pill" id="vpnPill"><i></i><span id="vpnLabel">VPN выключен</span></div><button class="icon-btn" id="settingsBtn">⚙ Настройки</button></header>
<nav><button class="tab active">Вкладка 1</button><button id="newTab" class="new-tab">＋</button></nav>
<section class="toolbar"><button class="navbtn" id="back">‹</button><button class="navbtn" id="forward">›</button><button class="navbtn" id="reload">↻</button><input id="address" placeholder="Введите адрес или поисковый запрос" value="https://www.google.com"><button class="go" id="go">Перейти</button></section>
<main><webview id="view" src="https://www.google.com" partition="persist:browser" allowpopups></webview></main>
<div id="vpnPanel" class="panel hidden"><div class="panel-head"><div><b>Pulse VPN</b><small>Защита трафика браузера через sing-box</small></div><button id="closePanel">×</button></div>
<label for="subscription">Подписка (URL или текст)</label><textarea id="subscription" placeholder="https://… или vless://… / Clash YAML / sing-box JSON"></textarea>
<div class="panel-actions"><button id="connect" class="primary">Подключить VPN</button><button id="disconnect" class="secondary">Отключить</button><button id="refresh" class="secondary">Обновить</button></div>
<label for="server">Сервер</label><select id="server"><option value="">Автоматический / первый сервер</option></select>
<div class="settings-grid"><label><input type="checkbox" id="autoConnect"> Подключать VPN при запуске</label><label><input type="checkbox" id="autoUpdate"> Автообновление подписки</label><label><input type="checkbox" id="adBlock" checked> Блокировка рекламы (базовая)</label><label>Интервал обновления, минут <input id="updateMinutes" type="number" min="15" max="10080" value="360"></label></div>
<button id="saveSettings" class="secondary full">Сохранить настройки</button><div id="status" class="status">VPN не подключён</div><p class="hint">WebRTC ограничивает UDP вне прокси. При аварийном завершении VPN прокси браузера сбрасывается; полноценная системная блокировка всех каналов утечки не гарантируется.</p></div>
<script src="renderer.js"></script></body></html>
